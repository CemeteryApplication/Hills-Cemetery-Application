<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Database backup</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f5f4ef;color:#1a1a1a}
  .wrap{max-width:560px;margin:0 auto;padding:16px}
  h1{font-size:20px;margin:8px 0 4px}
  p.sub{margin:0 0 14px;color:#555;font-size:13px}
  .card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:14px;margin-bottom:14px}
  label{display:block;font-size:12px;color:#555;margin:10px 0 3px}
  input[type=text],input[type=password],input[type=url]{width:100%;box-sizing:border-box;padding:10px;border:1px solid #bbb;border-radius:8px;font-size:15px}
  button{padding:11px 14px;border:0;border-radius:8px;background:#2d6a4f;color:#fff;font-size:15px;font-weight:600;margin-top:12px;width:100%}
  button.alt{background:#fff;color:#2d6a4f;border:1px solid #2d6a4f}
  button:disabled{opacity:.5}
  #log{font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre-wrap;background:#111;color:#cfe;padding:10px;border-radius:8px;max-height:260px;overflow:auto;display:none;margin-top:12px}
  .ok{color:#1b7a3a;font-weight:600}.bad{color:#b00020;font-weight:600}
  #result{margin-top:10px;font-size:14px}
  small{color:#666}
</style>
</head>
<body>
<div class="wrap">
  <h1>Database backup</h1>
  <p class="sub">Downloads a complete copy of every table to this phone. Keep at least two copies (for example one in Google Drive).</p>

  <div class="card">
    <label for="url">Project address</label>
    <input id="url" type="url" placeholder="https://abcdefgh.supabase.co" autocomplete="off">
    <label for="label">Name for the file (optional)</label>
    <input id="label" type="text" placeholder="e.g. riverside or hca">
    <label for="key">Backup key (not saved)</label>
    <input id="key" type="password" autocomplete="off">
    <button id="go" onclick="startBackup()">Download backup now</button>
    <div id="log"></div>
    <div id="result"></div>
  </div>

  <div class="card">
    <b>Check a backup file</b><br><small>Opens a saved backup on this phone and shows what is inside. Nothing is uploaded anywhere.</small>
    <button class="alt" onclick="document.getElementById('file').click()">Choose a backup file</button>
    <input id="file" type="file" accept=".json,application/json" style="display:none" onchange="checkFile(this)">
    <div id="checkout" style="margin-top:10px;font-size:13px"></div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
$('url').value = localStorage.getItem('bk_url') || '';
$('label').value = localStorage.getItem('bk_label') || '';

function logLine(t){ const l=$('log'); l.style.display='block'; l.textContent+=t+'\n'; l.scrollTop=l.scrollHeight; }

async function callFn(base, key, body){
  const r = await fetch(base.replace(/\/+$/,'') + '/functions/v1/backup-export', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(Object.assign({key}, body))
  });
  const d = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
  return d;
}

// Reads every table, a page at a time. Returns {meta, parts} where parts joins into one JSON text.
async function buildBackup(base, key, label, log){
  const list = await callFn(base, key, {action:'list'});
  const meta = { tool:'hca-backup-1', project:base, label:label||'', taken_at:list.taken_at, counts:{}, fetched:{} };
  list.tables.forEach(t => meta.counts[t.name] = t.count);
  const parts = [];
  const body = [];
  let problems = 0;
  for (const t of list.tables){
    let rows = [], from = 0, size = 300, fails = 0;
    while (true){
      let d;
      try { d = await callFn(base, key, {action:'rows', table:t.name, from, count:size}); fails = 0; }
      catch(e){
        fails++;
        if (size > 25){ size = Math.max(25, Math.floor(size/2)); log('  ' + t.name + ': retrying with smaller pages (' + e.message + ')'); continue; }
        if (fails < 3){ continue; }
        throw new Error('Could not read ' + t.name + ': ' + e.message);
      }
      rows.push.apply(rows, d.rows);
      if (d.rows.length < size) break;
      from += d.rows.length;
    }
    meta.fetched[t.name] = rows.length;
    const diff = rows.length - t.count;
    log(t.name + ': ' + rows.length + ' rows' + (diff ? '  (expected ' + t.count + ')' : ''));
    if (diff) problems++;
    body.push(JSON.stringify(t.name) + ':' + JSON.stringify(rows));
    rows = null;
  }
  meta.mismatched_tables = problems;
  parts.push('{"meta":' + JSON.stringify(meta) + ',"tables":{' + body.join(',') + '}}');
  return { meta, parts, problems };
}

async function startBackup(){
  const base = $('url').value.trim(), key = $('key').value, label = $('label').value.trim();
  if (!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(base)){ $('result').innerHTML='<span class="bad">Enter the project address like https://abcdefgh.supabase.co</span>'; return; }
  if (!key){ $('result').innerHTML='<span class="bad">Enter your backup key</span>'; return; }
  localStorage.setItem('bk_url', base); localStorage.setItem('bk_label', label);
  $('go').disabled = true; $('log').textContent=''; $('result').textContent='Working…';
  try {
    const out = await buildBackup(base, key, label, logLine);
    const total = Object.values(out.meta.fetched).reduce((a,b)=>a+b,0);
    const stamp = new Date().toISOString().slice(0,16).replace(/[-:T]/g,'').replace(/^(\d{8})(\d{4})$/,'$1-$2');
    const name = 'backup-' + ((label||base.replace(/^https:\/\//,'').split('.')[0]).replace(/[^a-z0-9_-]/gi,'')) + '-' + stamp + '.json';
    const blob = new Blob(out.parts, {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    $('result').innerHTML = '<span class="ok">Done.</span> ' + Object.keys(out.meta.fetched).length + ' tables, ' + total + ' rows saved as <b>' + name + '</b> (' + (blob.size/1048576).toFixed(1) + ' MB).' +
      (out.problems ? '<br><span class="bad">' + out.problems + ' table(s) changed size while copying. Run it again to be safe.</span>' : '');
  } catch(e){
    $('result').innerHTML = '<span class="bad">Backup failed: ' + String(e.message).replace(/</g,'&lt;') + '</span>';
  }
  $('go').disabled = false;
}

function checkFile(inp){
  const f = inp.files && inp.files[0]; if (!f) return;
  const out = $('checkout'); out.textContent = 'Reading…';
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const j = JSON.parse(rd.result);
      if (!j.meta || !j.tables) throw new Error('This does not look like a backup from this tool');
      let html = '<b>' + (j.meta.label||'(no name)') + '</b> · ' + j.meta.project + '<br>Taken ' + j.meta.taken_at + '<br>';
      let total = 0, bad = [];
      Object.keys(j.tables).sort().forEach(n => {
        const have = j.tables[n].length; total += have;
        if (have !== j.meta.fetched[n]) bad.push(n + ' (file has ' + have + ', expected ' + j.meta.fetched[n] + ')');
      });
      html += Object.keys(j.tables).length + ' tables, ' + total + ' rows.<br>';
      const big = Object.keys(j.tables).filter(n=>j.tables[n].length).sort((a,b)=>j.tables[b].length-j.tables[a].length).slice(0,8)
        .map(n => n + ': ' + j.tables[n].length).join('<br>');
      html += '<small>Largest tables:<br>' + big + '</small><br>';
      html += bad.length ? '<span class="bad">Problem: ' + bad.join('; ') + '</span>' : '<span class="ok">File is complete and readable.</span>';
      out.innerHTML = html;
    } catch(e){ out.innerHTML = '<span class="bad">' + String(e.message).replace(/</g,'&lt;') + '</span>'; }
  };
  rd.readAsText(f); inp.value='';
}
</script>
</body>
</html>
